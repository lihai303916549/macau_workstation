name: 六子每日自动更新

on:
  # 北京时间 21:35 起每 5 分钟跑一次，直到跑成功为止（2026-10-20 用户定）
  # 「跑到成功为止」由 update.js 幂等守卫实现：最新期已判定+下期预测已存档 → 秒退，
  # 后续每5分钟触发都是空转（几秒退出、无提交）。workflow_dispatch 手动触发永远强制执行。
  # 注：GitHub schedule 不支持 */5 step 跨小时缩写，按小时拆两条 cron。
  schedule:
    - cron: '35,40,45,50,55 13 * * *'   # UTC 13:35-13:55 = 北京 21:35-21:55 每5分钟
    - cron: '*/5 14 * * *'              # UTC 14:00-14:55 = 北京 22:00-22:55 每5分钟
    - cron: '0 15 * * *'                # UTC 15:00 = 北京 23:00 末班车兜底
  # 允许在 GitHub 网页上手动点「Run workflow」立即跑一次（跳过幂等守卫，强制执行）
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行自动更新
        run: node update.js

      # 委员会预测记录 + 开奖判定（100模型）：在数据更新后跑，把"下一期预测"存档、
      # 并对已开奖期做命中判定，写入 committee/bt100_records.json 与 bt100_predict.json。
      # 该步骤幂等：下一期已存档则跳过；某期已开奖则只补判定。失败不阻断主数据更新。
      - name: 委员会预测记录 + 开奖判定
        run: |
          HTML_PATH=index.html BT_REC=committee/bt100_records.json BT_PRED=committee/bt100_predict.json node committee/bt_models100.js --predict
        continue-on-error: true

      - name: 提交并推送
        run: |
          git config user.name "laoliu-bot"
          git config user.email "laoliu-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "自动更新 $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      # 注：原「部署到腾讯云 CloudBase」步骤已移除——CloudBase 未备案默认域名被腾讯云
      # 返回 HTTP 418 拦截（连下载都不给），免费"免梯子+在线看"走不通。
      # 现线上主方案为 GitHub Pages（本 workflow 推送 main 分支后 Pages 自动重建即可）。
