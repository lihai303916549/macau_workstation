name: 老六每日自动更新

on:
  # 北京时间 21:40（开奖 21:32:32 之后 8 分钟）= 13:40 UTC
  schedule:
    - cron: '40 13 * * *'
    # 保险：22:10 再跑一次（若 21:40 接口尚未更新，这一趟补上）
    - cron: '10 14 * * *'
  # 允许在 GitHub 网页上手动点「Run workflow」立即跑一次
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行自动更新
        run: node update.js

      - name: 提交并推送
        run: |
          git config user.name "laoliu-bot"
          git config user.email "laoliu-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "自动更新 $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      # 注：原「部署到腾讯云 CloudBase」步骤已移除——CloudBase 未备案默认域名被腾讯云
      # 返回 HTTP 418 拦截（连下载都不给），免费"免梯子+在线看"走不通。
      # 现线上主方案为 GitHub Pages（本 workflow 推送 main 分支后 Pages 自动重建即可）。
