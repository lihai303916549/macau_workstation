name: 老六每日自动更新

on:
  # 北京时间 21:40（开奖 21:32:32 之后 8 分钟）= 13:40 UTC
  schedule:
    - cron: '40 13 * * *'
    # 保险：22:10 再跑一次（若 21:40 接口尚未更新，这一趟补上）
    - cron: '10 14 * * *'
  # 允许在 GitHub 网页上手动点「Run workflow」立即跑一次
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行自动更新
        run: node update.js

      - name: 提交并推送
        run: |
          git config user.name "laoliu-bot"
          git config user.email "laoliu-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "自动更新 $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: 同步到腾讯云 COS（免梯子访问）
        if: ${{ secrets.COS_SECRET_ID != '' }}
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          pip install -q cos-python-sdk-v5
          python cos_sync.py --dir . update.js,cos_sync.py
