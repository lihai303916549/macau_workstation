<script>
const API_BASE = 'https://history.macaumarksix.com/history/macaujc2/y/';
// 统一用 UTC+8（澳门/北京时间），避免用户设备时区导致年份、倒计时偏差
const UTC8_OFFSET_MS = 8 * 3600 * 1000;
// 取澳门时间的年份
function macauYear() { return new Date(Date.now() + UTC8_OFFSET_MS).getUTCFullYear(); }
let allData = [];
let compositeResult = null;

// 2026年标准生肖对照表（用户确认，查表法，禁止用公式推算）
const STD_2026 = {1:'马',2:'蛇',3:'龙',4:'兔',5:'虎',6:'牛',7:'鼠',8:'猪',9:'狗',10:'鸡',11:'猴',12:'羊'};
function getNumberZodiac(num) { const key = num <= 12 ? num : ((num - 1) % 12) + 1; return STD_2026[key]; }
function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function extractYear(openTime) {
  if (!openTime) return 2026;
  return parseInt(openTime.slice(0, 4), 10) || 2026;
}

async function fetchYearData(year) {
  try {
    const resp = await fetch(API_BASE + year, { cache: 'no-store' });
    const json = await resp.json();
    const raw = json.data || [];
    const out = [];
    for (const item of raw) {
      const parts = (item.openCode || '').split(',');
      if (parts.length !== 7) continue;
      const nums = parts.map(p => parseInt(p.trim(), 10));
      if (nums.some(n => isNaN(n))) continue;
      const periodNum = item.expect ? item.expect.slice(-3) : '001';
      const openYear = extractYear(item.openTime);
      const correctedPeriod = openYear + periodNum;
      out.push({ period: correctedPeriod, numbers: nums.slice(0,6), special: nums[6], openTime: item.openTime });
    }
    return out;
  } catch (e) {
    return [];
  }
}

// 内嵌历史数据解析（已按开奖时间升序排好）
// 每条格式：[期号, 开奖日期(YYYY-MM-DD), "6个正码,特码"]
function embeddedData() {
  var out = [];
  for (var i = 0; i < EMBEDDED_DATA.length; i++) {
    var row = EMBEDDED_DATA[i];
    var p = row[2].split(',');
    out.push({
      period: row[0],
      numbers: [+p[0], +p[1], +p[2], +p[3], +p[4], +p[5]],
      special: +p[6],
      openTime: row[1]
    });
  }
  return out;
}

// 网络数据被视为有效的最少期数（少于此值说明拉取不完整，继续用内置数据）
const MIN_NET_RECORDS = 50;

// 优先用实时数据；API 无 CORS 头导致浏览器取不到时，自动回退到内置数据
async function fetchData() {
  const base = embeddedData();
  try {
    const currentYear = macauYear();
    const net = await fetchYearData(currentYear);
    if (net && net.length >= MIN_NET_RECORDS) {
      net.sort((a, b) => a.openTime.localeCompare(b.openTime));
      if (net[net.length - 1].period > base[base.length - 1].period) {
        return { data: net, source: '实时' };
      }
    }
  } catch (e) {}
  return { data: base, source: '内置' };
}

// ===== 平肖（生肖预测）：七码(6正码+特码)频率众数法 =====
// 命中口径：开奖 7 个号（6 正码 + 特码）任一号码生肖 == 推荐生肖
// 这是网页一直显示的「平特肖」版本（用户习惯口径）：近30期 7 球生肖频率取最热
// 全量 walk-forward(621期)：约 51.85%，优于随机基线 ~47.7%
const ZODIACS = ['马','蛇','龙','兔','虎','牛','鼠','猪','狗','鸡','猴','羊'];
function zAll7Freq(H) {
  const r = H.slice(-30);
  const f = {}; ZODIACS.forEach(z => f[z] = 0);
  for (const d of r) {
    const nums = [...d.numbers, d.special];
    for (const n of nums) f[getNumberZodiac(n)]++;
  }
  return f;
}
// 基于七码频率，输出主推 + Top3 + 相对权重
function zEnsemble(H) {
  const f = zAll7Freq(H);
  const rk = ZODIACS.slice().sort((a, b) => f[b] - f[a]);
  const top1 = rk[0];
  const top3 = rk.slice(0, 3);
  const top3sum = top3.reduce((s, z) => s + f[z], 0);
  const probs = {};
  top3.forEach(z => probs[z] = top3sum > 0 ? f[z] / top3sum : 0);
  return { top1, ranked: rk, probs };
}
// 主推单生肖（与历史战绩口径兼容 predZodiacFor）
function zodiacPredictSpecial(data) { return zEnsemble(data).top1; }

// ===== 23码预测：尾数热号法 =====
// 取近30期最热 5 个尾数 → 对应全部号码 → 按出现频率取前 23 个
// 命中口径：开奖特码(特码)落在 23 码内（标准 23 码定义）
// 全量 walk-forward(621期)：约 44.93%（随机基线 23/49≈46.94%），长样本无显著优势
function tailHotPredict(data) {
  const recent30 = data.slice(-30);
  const tailFreq = {};
  for (const d of recent30) {
    const nums = [...d.numbers, d.special];
    for (const n of nums) { tailFreq[n % 10] = (tailFreq[n % 10] || 0) + 1; }
  }
  const sortedTails = Object.keys(tailFreq).map(Number).sort((a, b) => tailFreq[b] - tailFreq[a]);
  const topTails = new Set(sortedTails.slice(0, 5));
  const candidates = [];
  for (let n = 1; n <= 49; n++) { if (topTails.has(n % 10)) candidates.push(n); }
  const freq = {};
  for (const d of recent30) {
    const nums = [...d.numbers, d.special];
    for (const n of nums) { freq[n] = (freq[n] || 0) + 1; }
  }
  candidates.sort((a, b) => (freq[b] || 0) - (freq[a] || 0));
  return candidates.slice(0, 23).sort((a, b) => a - b);
}

function compositePredict(data) {
  const e = zEnsemble(data);
  return { codes: tailHotPredict(data), zodiac: e.top1, top3: e.ranked.slice(0,3), probs: e.probs, six: sixZodiacPredict(data) };
}

// ===== 6肖推荐（专盯特码球 / 特码，最后一球）=====
// 命中口径：开奖特码(最后一球)的生肖 ∈ 推荐 6 肖 即中（标准「六肖」玩法）
// 算法：近20期特码球生肖「频率(×1) + 轻微遗漏(×0.05)」加权取最热 6 个
// 全量 walk-forward(651期)：约 48.02%（理论随机基线 6/12≈50%；特码近随机，长期趋向 50%）
function sixZodiacPredict(data, win=20, k=6) {
  const r = data.slice(-win);
  const f = {}; ZODIACS.forEach(z => f[z] = 0);
  for (const d of r) f[getNumberZodiac(d.special)]++;
  const last = {}; ZODIACS.forEach(z => last[z] = -1e9);
  r.forEach((d, idx) => { last[getNumberZodiac(d.special)] = idx; });
  const miss = {}; ZODIACS.forEach(z => miss[z] = (r.length - 1) - last[z]);
  const score = {}; ZODIACS.forEach(z => score[z] = f[z] * 1.0 + miss[z] * 0.05);
  return ZODIACS.slice().sort((a, b) => score[b] - score[a]).slice(0, k);
}

function getNextPeriod(data) {
  const last = data && data.length ? data[data.length - 1] : null;
  if (last) {
    // 优先：按期末开奖日期(YYYY-MM-DD) +1 天推算（已验证可处理跨年）
    const dayStr = (last.openTime || '').slice(0, 10);
    const t = Date.parse(dayStr + 'T00:00:00Z');
    if (!isNaN(t)) {
      const p = periodOfDate(new Date(t + 86400000));
      if (p && p.length === 7 && !isNaN(+p.slice(3))) return p;   // 合法期号才用
    }
    // openTime 缺失/异常：改从末期期号本身推算次日（day-of-year+1，自动跨年）
    try {
      const ps = String(last.period);
      const y = +ps.slice(0, 4);
      const doy = +ps.slice(4);
      if (y >= 2000 && doy >= 1 && doy <= 366) {
        const d = new Date(Date.UTC(y, 0, 1) + (doy - 1) * 86400000);   // 末期开奖日(UTC)：期号DDD=年内第DDD天=Jan1+(DDD-1)天
        const p = periodOfDate(new Date(d.getTime() + 86400000));
        if (p && p.length === 7 && !isNaN(+p.slice(3))) return p;
      }
    } catch (e) {}
  }
  // 兜底：按当前澳门开奖日推算（不依赖内嵌数据），保证任何情况下都不出现 NaN
  return offlineNextPeriod();
}

async function loadRecords() {
  // 优先尝试本地record.json（exe场景：file://协议直接读文件）
  try {
    const resp = await fetch('./record.json', {cache:'no-store'});
    if (resp.ok) {
      const json = await resp.json();
      if (json.history && json.history.length > 0) {
        checkRecordSync(json.history);
        return json.history;
      }
    }
  } catch(e) {}
  // 回退到硬编码数据（网页场景）
  return EMBEDDED_RECORDS;
}

function renderAlgoNote(pred, targetId) {
  const el = document.getElementById(targetId);
  if (!el) return;
  if (!pred || !pred.weights) { el.innerHTML = ''; return; }
  const keys = Object.keys(pred.weights);
  const sum = keys.reduce((a, k) => a + (pred.weights[k] || 0), 0) || 1;
  let html = '<div class="algo-note">';
  html += '<div class="algo-note-title">🧠 Ensemble 动态融合 · ' + keys.length + ' 模型 · 全部基于历史数据学习（无随机成分）</div>';
  html += '<div>' + keys.map(k => {
    const w = pred.weights[k] || 0;
    const pct = w / sum * 100;
    const zero = w <= 0 ? ' algo-chip-zero' : '';
    return '<span class="algo-chip' + zero + '" title="' + (ALGO_DESC[k] || k) + '">' + (ALGO_LABEL[k] || k) + ' ' + pct.toFixed(1) + '%</span>';
  }).join('') + '</div>';
  if (pred.details) {
    html += '<div class="algo-note-sub">各模型独立主推：' + keys.map(k =>
      (ALGO_LABEL[k] || k) + '→' + ((pred.details[k] && pred.details[k].zodiac) || '—')
    ).join(' · ') + '</div>';
  }
  html += '<div class="algo-note-sub2">权重 = 各模型近60期影子回测命中率超基线(0.4786)换算的融合贡献占比；超额≤0 自动停权。' +
          '三个指标（23码/平特肖/6肖）取自同一份融合分数，只是取法不同：23码=号码分前23、' +
          '平特肖=生肖聚合最高、6肖=生肖聚合前6（生肖聚合已除以各生肖号数消除偏置）。' +
          '随机基准：平特肖纯随机理论值 1-(11/12)^7 ≈ 46.3%，6肖 ≈ 50%，23码 ≈ 47%（23/49）——' +
          '各模型回测命中需高于此线才算真信号。事前预测存档制，只做事前不事后重算。</div>';
  // 共识投票层
  const cons = pred.consensus;
  if (cons) {
    const agreePct = (cons.agree * 100).toFixed(1);
    const isSkip = cons.action === 'skip';
    html += '<div class="algo-note-sub" style="margin-top:6px;">🗳 <b>共识投票</b>：' + keys.length + ' 个模型主推生肖投票，' +
            '一致度 <b style="color:' + (isSkip ? 'var(--red)' : 'var(--green)') + '">' + agreePct + '%</b>' +
            '（' + (cons.count || 0) + '/' + (cons.total || keys.length) + ' 票推 ' + (cons.top || '—') + '，阈值 60%）；' +
            (isSkip ? '<b style="color:var(--red)">分歧过大 → 本期不押注（保护本金）</b>' : '分歧可控 → 正常下注') + '</div>';
    const vt = Object.entries(cons.votes || {}).sort((a,b)=>b[1]-a[1])
      .map(([z,c]) => z + '×' + c).join(' · ');
    html += '<div class="algo-note-sub2">投票明细：' + vt +
            '　（投票=各模型【独立】意见的分散度检验；实际押注以【加权融合主推】为准，融合已按各模型回测表现加权）</div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

function renderComposite(pred, nextPeriod) {
  const isFused = !!(pred && pred.details);
  const nAlgo = isFused ? Object.keys(pred.weights || {}).length : 0;
  const algoTag = isFused ? '(' + nAlgo + '模型融合)' : '(尾数热号法)';
  setText('composite-title', '📊 23码预测 ' + algoTag + ' — 第 ' + nextPeriod + ' 期');
  setHtml('composite-codes',
    pred.codes.map(n => '<span class="num-ball">' + pad2(n) + '</span>').join(''));
  setText('zodiac-title', '🐲 生肖预测 (平特肖' + (isFused ? '·' + nAlgo + '模型融合' : '') + ') — 第 ' + nextPeriod + ' 期');
  // 每个生肖对应的号码（2026年：马5个号，其余11生肖各4个）
  const numsByZ = {}; ZODIACS.forEach(z => numsByZ[z] = []);
  for (let n = 1; n <= 49; n++) numsByZ[getNumberZodiac(n)].push(n);
  const top3 = pred.top3 || [pred.zodiac];
  const probs = pred.probs || {};
  const top1 = top3[0] || pred.zodiac;
  let html = '<div style="font-size:22px;color:var(--green);font-weight:600;margin-bottom:6px;">融合主推 ' + top1 + '（' + numsByZ[top1].length + '个号）</div>';
  html += '<div style="font-size:12px;color:var(--text);opacity:.85;line-height:1.95;">';
  top3.forEach((z, i) => {
    const p = (probs[z] || 0) * 100;

    const tag = i === 0 ? '主推' : ('次' + i);
    html += '<div style="display:flex;align-items:center;gap:6px;">' +
            '<span style="width:76px;text-align:right;">' + tag + '·' + z + '(' + numsByZ[z].length + '号)</span>' +

  if (pred.zodiacScores && pred.zodiacScores.length === 12) {

    const mx = Math.max.apply(null, zs);
    html += '<div style="margin-top:12px;">';
    html += '<div style="font-size:10px;opacity:.65;margin-bottom:5px;line-height:1.6;">12生肖融合分数全景 · 绿柱=融合主推；各生肖分数越接近=模型分歧越大（分数已除以各生肖号数，消除"马5个号"的天然优势）</div>';
    html += '<div style="display:flex;gap:3px;align-items:flex-end;">';
    for (let i = 0; i < 12; i++) {
      const z = ZODIACS[i], v = zs[i], w = mx > 0 ? (v / mx) : 0;
      const isTop = (z === top1);
      html += '<div style="flex:1;min-width:0;text-align:center;">' +
        '<div style="height:30px;display:flex;align-items:flex-end;justify-content:center;">' +
          '<div style="width:100%;height:' + Math.max(5, Math.round(w * 30)) + 'px;background:' + (isTop ? 'var(--green)' : 'var(--accent)') + ';opacity:' + (isTop ? '1' : '.42') + ';border-radius:2px 2px 0 0;"></div>' +
        '</div>' +
        '<div style="font-size:10px;color:' + (isTop ? 'var(--green)' : 'var(--text-muted)') + ';font-weight:' + (isTop ? '700' : '400') + ';">' + z + '</div>' +
        '<div style="font-size:9px;opacity:.55;">' + v.toFixed(2) + '</div>' +

    html += (i > 0 ? '<br>' : '') + z + '：' + numsByZ[z].map(pad2).join(' ');

  setHtml('zodiac-result', html);

  renderAlgoNote(pred, 'composite-algo');
  renderAlgoNote(pred, 'zodiac-algo');
  renderAlgoNote(pred, 'six-algo');
}

function copyText(text) {
  if (!text) return;
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}
function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;z-index:9999;max-width:80vw;';
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._timer); t._timer = setTimeout(() => { t.style.display = 'none'; }, 1800);
}
function copyZodiac() {
  const el = document.getElementById('zodiac-result');
  if (!el) return;
  const text = el.textContent.trim();
  copyText(text);
  if (text) showToast('已复制平特肖: ' + text);
}
function copyCodes() {
  const el = document.getElementById('composite-codes');
  if (!el) return;
  const text = Array.from(el.querySelectorAll('.num-ball')).map(s => s.textContent.trim()).join(' ');
  copyText(text);
  if (text) showToast('已复制23码: ' + text);
}

function copySix() {
  const el = document.getElementById('six-result');
  if (!el) return;

  if (text) showToast('已复制6肖: ' + text);
}

// 预测值从事前存档读（record.json / EMBEDDED_RECORDS 内嵌的 pred_* 字段），
// ★严禁在此用当前历史重算过去★（291期"假虎✓"事故的根因就是旧代码事后重算）
function predZodiacFor(r) { return r.pred_zodiac || null; }
function predCodesFor(r) { return r.pred_codes || null; }
function predSixFor(r) { return r.pred_six || null; }

// ===== 每期隐藏按钮（localStorage 记忆，刷新/每晚数据更新后仍生效）=====
var HIDE_KEY_REC = 'lz6_hidden_rec';
var HIDE_KEY_BET = 'lz6_hidden_bet';
function getHiddenList(key) {
  try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { return []; }
}
function saveHiddenList(key, arr) {
  try { localStorage.setItem(key, JSON.stringify(arr)); } catch (e) {}
}
function hideRowBtn(key, period, btn) {
  var arr = getHiddenList(key);
  if (arr.indexOf(period) < 0) { arr.push(period); saveHiddenList(key, arr); }
  var tr = btn.closest ? btn.closest('tr') : null;
  if (tr) tr.style.display = 'none';
  updateRestoreBtn(key);
}
function applyHiddenRows(key, tbody) {
  var arr = getHiddenList(key);
  for (var i = 0; i < arr.length; i++) {
    var tr = tbody.querySelector('tr[data-period="' + arr[i] + '"]');
    if (tr) tr.style.display = 'none';
  }
  updateRestoreBtn(key);
}
function updateRestoreBtn(key) {
  var arr = getHiddenList(key);
  var el = document.getElementById(key === HIDE_KEY_REC ? 'rec-restore' : 'bet-restore');
  if (!el) return;
  if (arr.length > 0) {
    el.style.display = '';
    el.textContent = '↩ 恢复 ' + arr.length + ' 期';
  } else {
    el.style.display = 'none';
    el.textContent = '';
  }
}
function restoreRecords() { saveHiddenList(HIDE_KEY_REC, []); renderRecords(); }
function restoreBet() { saveHiddenList(HIDE_KEY_BET, []); loadBetTable(); }

async function renderRecords() {
  const records = await loadRecords();
  const fmtZ = (n) => pad2(n) + getNumberZodiac(n);

  const rows = [];
  let codeWin = 0, zodiacWin = 0, sixWin = 0, counted = 0;
  for (const r of records) {
    const nums = (r.actual_numbers || r.numbers || []).slice(0, 6);
    const special = r.actual_special !== undefined ? r.actual_special : (r.actual_numbers || r.numbers || [])[6];
    const has = nums.length === 6 && special !== undefined;
    const lotteryNum = has ? nums.map(n => fmtZ(n)).join('+') + '=' + fmtZ(special) : '?';
    // 事前预测（从事前存档 pred_* 读，绝不事后重算——用户2026-10-19铁律）
    const predC = predCodesFor(r);
    // 平特肖：开奖 7 个号（6正码+特码）任一生肖 == 事前推荐生肖
    const predZ = predZodiacFor(r);
    // 6肖：特码(最后一球)生肖 ∈ 事前推荐6肖
    const predS = predSixFor(r);
    // 命中以记录里的判定值为准（update.js 事前判定写入）；无预测存档则显示 ?
    const normHit = v => (v === 1 ? 1 : v === 0 ? 0 : null);
    const codeHit = has ? normHit(r.code_hit) : null;
    const zodiacHit = has ? normHit(r.zodiac_hit) : null;
    const sixHit = has ? normHit(r.six_hit) : null;
    const codeIcon = codeHit === 1 ? '✓' : codeHit === 0 ? '✗' : '?';
    const zodiacIcon = zodiacHit === 1 ? '✓' : zodiacHit === 0 ? '✗' : '?';
    const sixIcon = sixHit === 1 ? '✓' : sixHit === 0 ? '✗' : '?';
    const codeColor = codeIcon === '✓' ? 'var(--green)' : codeIcon === '✗' ? 'var(--red)' : 'var(--text)';
    const zodiacColor = zodiacIcon === '✓' ? 'var(--green)' : zodiacIcon === '✗' ? 'var(--red)' : 'var(--text)';
    const sixColor = sixIcon === '✓' ? 'var(--green)' : sixIcon === '✗' ? 'var(--red)' : 'var(--text)';
    rows.push('<tr data-period="' + r.period + '"><td>' + r.period + '</td><td>' + lotteryNum + '</td>' +
      '<td style="color:' + codeColor + '">' + codeIcon + '</td>' +
      '<td style="color:' + zodiacColor + '">' + (predZ ? predZ + ' ' : '') + zodiacIcon + '</td>' +
      '<td style="color:' + sixColor + '">' + (predS ? predS.join('/') + ' ' : '') + sixIcon + '</td>' +
      '<td><button type="button" class="hide-btn" title="隐藏本期" onclick="hideRowBtn(\'' + HIDE_KEY_REC + '\',' + r.period + ',this)">隐藏</button></td></tr>');
    if (has) counted++;
    if (has && codeHit === 1) codeWin++;
    if (has && zodiacHit === 1) zodiacWin++;
    if (has && sixHit === 1) sixWin++;
  }

  setHtml('record-body', rows.join(''));
  applyHiddenRows(HIDE_KEY_REC, document.getElementById('record-body'));
  if (rows.length === 0) {
    setText('record-summary', '暂无战绩（2026-10-19 起从292期重新记录：每晚事前预测→开奖后按实判定）');
  } else {
    setText('record-summary', '累计' + counted + '期：23码 ' + codeWin + '/' + counted + '（' + (counted > 0 ? (codeWin/counted*100).toFixed(1) : '0') + '%），平特肖 ' + zodiacWin + '/' + counted + '（' + (counted > 0 ? (zodiacWin/counted*100).toFixed(1) : '0') + '%），6肖 ' + sixWin + '/' + counted + '（' + (counted > 0 ? (sixWin/counted*100).toFixed(1) : '0') + '%）');
  }
}

// ===== 平肖投注计划表（桌面 Excel 每晚由 export_table.py 导出 bet_table.json）=====
function fmtBetNum(v) {
  if (v === null || v === undefined || v === '') return '—';
  if (typeof v === 'number') return v.toLocaleString('zh-CN');
  return v;
}
async function loadBetTable() {
  const body = document.getElementById('bet-body');
  const kpiEl = document.getElementById('bet-kpi');
  const sumEl = document.getElementById('bet-summary');
  if (!body) return;
  let data = null;
  try {
    const resp = await fetch('./bet_table.json', { cache: 'no-store' });
    if (resp.ok) data = await resp.json();
  } catch (e) {}
  if (!data || !data.rows || !data.rows.length) {
    if (kpiEl) kpiEl.textContent = '暂无数据（每晚21:40自动对奖后生成）';
    return;
  }
  const k = data.kpi || {};
  const pnlColor = (k.total_pnl >= 0) ? 'var(--green)' : 'var(--red)';
  const kpis = [
    ['交易笔数', k.trades, 'var(--accent)'],
    ['平均中率', (k.win_rate === null || k.win_rate === undefined) ? '—' : (k.win_rate * 100).toFixed(1) + '%', 'var(--accent)'],
    ['累计盈亏', (k.total_pnl >= 0 ? '+' : '') + Number(k.total_pnl).toLocaleString('zh-CN'), pnlColor],
    ['现在总额', Number(k.current).toLocaleString('zh-CN'), 'var(--accent)'],
  ];
  if (kpiEl) kpiEl.innerHTML = kpis.map(function (t) {
    return '<div class="stat-item"><span class="label">' + t[0] + '</span> <span class="value" style="color:' + t[2] + '">' + t[1] + '</span></div>';
  }).join('');
  body.innerHTML = data.rows.map(function (x) {
    const rc = x.result === '赢' ? 'var(--green)' : x.result === '亏' ? 'var(--red)' : 'var(--text-muted)';
    const pc = (typeof x.pnl === 'number') ? (x.pnl >= 0 ? 'var(--green)' : 'var(--red)') : 'var(--text-muted)';
    const zc = x.zodiac === '猫' ? 'var(--red)' : 'var(--text)';
    // 共识度列：v6 新增（一致度% + 跳过标记）
    const agreeTxt = (x.agree === null || x.agree === undefined) ? '—' : (x.agree * 100).toFixed(0) + '%';
    const agreeColor = x.skipped ? 'var(--red)' : (x.agree === null || x.agree === undefined) ? 'var(--text-muted)' : (x.agree >= 0.6 ? 'var(--green)' : 'var(--red)');
    const agreeCell = '<td style="color:' + agreeColor + ';" title="' + (x.skipped ? '共识不足，本期未下注' : '模型主推一致度（阈值60%）') + '">' + agreeTxt + (x.skipped ? ' 跳过' : '') + '</td>';
    return '<tr data-period="' + x.period + '"><td>' + x.period + '</td>' +
      '<td style="color:' + zc + '">' + (x.zodiac || '—') + '</td>' +
      '<td>' + (x.odds === null || x.odds === undefined ? '—' : Number(x.odds).toFixed(1)) + '</td>' +
      '<td>' + (x.count === null || x.count === undefined ? '—' : x.count) + '</td>' +
      '<td style="color:' + rc + '; font-weight:600;">' + x.result + '</td>' +
      '<td>' + fmtBetNum(x.stake) + '</td>' +
      '<td style="color:' + pc + '">' + (typeof x.pnl === 'number' ? (x.pnl >= 0 ? '+' : '') + x.pnl.toLocaleString('zh-CN') : x.pnl) + '</td>' +
      '<td style="font-weight:600;">' + fmtBetNum(x.capital) + '</td>' +
      '<td>' + (x.bet || '—') + '</td>' +
      agreeCell +
      '<td><button type="button" class="hide-btn" title="隐藏本期" onclick="hideRowBtn(\'' + HIDE_KEY_BET + '\',' + x.period + ',this)">隐藏</button></td></tr>';
  }).join('');
  applyHiddenRows(HIDE_KEY_BET, body);
  if (sumEl) sumEl.textContent = '数据更新于 ' + (data.generated_at || '—') + ' · 与桌面 Excel「彩票系统-平肖计算表」每晚同步 · 起始本金 ' + data.capital_start + ' / 风险值 ' + data.risk;
}

async function init() {
  // 先渲染战绩（来自本地 EMBEDDED_RECORDS，不依赖网络）
  await renderRecords();
  // 渲染平肖投注计划表（桌面 Excel 每晚导出，失败不影响主页面）
  try { await loadBetTable(); } catch (e) { console.warn('bet table load failed:', e); }

  try {
    const fetched = await fetchData();
    allData = fetched.data;
    const lastPeriod = allData[allData.length-1].period;
    const nextPeriod = getNextPeriod(allData);
    // 优先用「前10种算法加权融合」预测（update.js 每天写入 prediction_result.json）；取不到则用页面本地算法
    let pred = null;
    try {
      const resp = await fetch('./prediction_result.json', { cache: 'no-store' });
      if (resp.ok) {
        const pj = await resp.json();
        if (pj && pj.fused && pj.next_period === nextPeriod) pred = pj;
      }
    } catch (e) {}
    compositeResult = pred || compositePredict(allData);
    renderComposite(compositeResult, nextPeriod);
    renderSixZodiac(compositeResult, nextPeriod);
    currentNextPeriod = nextPeriod;
    const algoLabel = pred ? '前10算法融合' : '频率法(本地)';
    setText('last-update', '数据截至 ' + lastPeriod + ' 期 · ' + new Date().toLocaleString('zh-CN') + ' · 算法：' + algoLabel + ' · 数据源：' + fetched.source);
  } catch (e) {
    setText('progress-text', '加载失败: ' + e.message);
    console.error(e);
  }
}

// 「强制刷新」：清掉本地缓存并重新加载页面，用于拉取云端已部署的最新版本。
// 注意：这里不再去请求开奖接口 —— 接口无 CORS 头，浏览器取不到，数据一律来自内置。
function forceUpdate() {
  const btn = document.getElementById('update-btn');
  if (!btn) return;
  btn.textContent = '⏳ 刷新中...';
  btn.disabled = true;

  // 清 Service Worker 缓存
  var clearCaches = (window.caches && caches.keys)
    ? caches.keys().then(function (keys) {
        return Promise.all(keys.map(function (k) { return caches.delete(k); }));
      }).catch(function () {})
    : Promise.resolve();

  // 注销旧 Service Worker，重新加载时会拉新版
  var unregister = (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
    ? navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) { return r.unregister(); }));
      }).catch(function () {})
    : Promise.resolve();

  Promise.all([clearCaches, unregister]).then(function () {
    if (location.protocol === 'file:') {
      location.reload();                 // 本地打开时直接重载
      return;
    }
    // 加时间戳，绕开浏览器磁盘缓存，确保拿到云端最新部署
    var url = location.href.split('#')[0];
    url += (url.indexOf('?') === -1 ? '?' : '&') + '_t=' + Date.now();
    location.replace(url);
  });
}

// ===== 开奖倒计时 =====
// 澳门 Mark Six 每天一期，开奖时刻固定 21:32:32（澳门/北京时间 UTC+8）
const DRAW_H = 21, DRAW_M = 32, DRAW_S = 32;
// 实测验证：期号 = 该日期在当年的第几天
//   2023-12-31 → 2023365（平年）  2024-12-31 → 2024366（闰年）
//   2025-12-31 → 2025365          2026-01-01 → 2026001
//   2023-01-04 未开奖，但期号仍按阳历编，故直接算「年内第几天」最准
function periodOfDate(date) {
  const y = date.getUTCFullYear();
  const doy = Math.floor((date.getTime() - Date.UTC(y, 0, 1)) / 86400000) + 1;
  return y + '' + String(doy).padStart(3, '0');
}

let currentNextPeriod = null;   // 由 init/forceUpdate 实时算出；未算出时用 offlineNextPeriod 兜底

// 统一按 UTC+8 计算，避免用户设备时区导致倒计时偏差
function nextDrawDate() {
  const macau = new Date(Date.now() + UTC8_OFFSET_MS);   // 其 UTC 字段即澳门本地时间
  let t = Date.UTC(macau.getUTCFullYear(), macau.getUTCMonth(), macau.getUTCDate(),
                   DRAW_H - 8, DRAW_M, DRAW_S);
  if (Date.now() >= t) t += 86400000;
  return new Date(t);
}

// 离线兜底：直接用下次开奖日期算期号，不依赖内嵌数据
function offlineNextPeriod() {
  try {
    return periodOfDate(nextDrawDate());
  } catch (e) { return '下期'; }
}


// 当前日期（澳门时间 UTC+8），如：2026年9月11日 星期五
const WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
function formatMacauDate() {
  const d = new Date(Date.now() + UTC8_OFFSET_MS);
  return d.getUTCFullYear() + '年' + (d.getUTCMonth() + 1) + '月' + d.getUTCDate() + '日 ' + WEEKDAYS[d.getUTCDay()];
}

function updateCountdown() {
  setText('now-date', formatMacauDate());
  const el = document.getElementById('countdown');
  if (!el) return;
  const diff = nextDrawDate().getTime() - Date.now();
  const period = currentNextPeriod || offlineNextPeriod();
  if (diff <= 0) {
    el.innerHTML = '🎯 第 <b>' + period + '</b> 期开奖中...';
    return;
  }
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  el.innerHTML = '⏰ 距 <b>' + period + '</b> 期开奖 <b style="color:var(--accent);">' +
    pad2(h) + ':' + pad2(m) + ':' + pad2(s) + '</b>';
}

let countdownTimer = setInterval(updateCountdown, 1000);
updateCountdown();

// 页面切到后台时暂停计时，回到前台立即刷新并恢复
document.addEventListener('visibilitychange', function () {
  clearInterval(countdownTimer);
  if (!document.hidden) {
    updateCountdown();
    countdownTimer = setInterval(updateCountdown, 1000);
  }
});

if ('serviceWorker' in navigator && navigator.serviceWorker) {
  const sw = navigator.serviceWorker;
  if (typeof sw.addEventListener === 'function') {
    let swReloading = false;
    sw.addEventListener('controllerchange', () => {
      if (swReloading) return;
      swReloading = true;
      location.reload();
    });
  }
  if (typeof sw.register === 'function') {
    sw.register('./sw.js').catch(() => {});
  }
}

(function() {
  var bar = document.getElementById('progress-bar');
  var text = document.getElementById('progress-text');
  var progress = 0;
  var timer = setInterval(function() {
    progress += Math.random() * 15 + 5;
    if (progress >= 95) progress = 95;
    bar.style.width = progress + '%';
    text.textContent = '加载中... ' + Math.floor(progress) + '%';
  }, 200);
  window.addEventListener('load', function() {
    clearInterval(timer);
    progress = 100;
    bar.style.width = '100%';
    text.textContent = '加载完成! 100%';
    setTimeout(function() {
      document.getElementById('loading').style.opacity = '0';
      setTimeout(function() {
        document.getElementById('loading').style.display = 'none';
      }, 500);
    }, 300);
  });
})();

// ===== 访问密码门：前端轻量鉴权（挡随手点开，非真加密）=====
(function () {
  var CORRECT = atob('MDEwOA=='); // 密码 base64 混淆，避免源码明文泄露
  var gate = document.getElementById('gate');
  var pwd = document.getElementById('gate-pwd');
  var btn = document.getElementById('gate-btn');
  var err = document.getElementById('gate-err');
  function unlock() {
    if (pwd.value === CORRECT) {
      err.textContent = '';
      gate.style.display = 'none';
      document.getElementById('loading').style.display = 'none';
      document.querySelector('.container').style.display = 'block';
      init();
    } else {
      err.textContent = '密码错误，请重试';
      pwd.value = '';
      pwd.focus();
    }
  }
  btn.addEventListener('click', unlock);
  pwd.addEventListener('keydown', function (e) { if (e.key === 'Enter') unlock(); });
  pwd.focus();
})();
// init() 已改由密码门解锁后调用，页面加载时不再直接执行
</script>
