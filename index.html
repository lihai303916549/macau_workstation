<script>
const API_BASE = 'https://history.macaumarksix.com/history/macaujc2/y/';
const ZODIAC = ["鼠","牛","虎","兔","龙","蛇","马","羊","猴","鸡","狗","猪"];
let allData = [];
let compositeResult = null;

function getYearZodiac(year) { return ZODIAC[(year - 4) % 12]; }
// 2026年标准对照表（用户确认）
const STD_2026 = {1:'马',2:'蛇',3:'龙',4:'兔',5:'虎',6:'牛',7:'鼠',8:'猪',9:'狗',10:'鸡',11:'猴',12:'羊'};
function getNumberZodiac(num) { const key = num <= 12 ? num : ((num - 1) % 12) + 1; return STD_2026[key]; }
function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function extractYear(openTime) {
  if (!openTime) return 2026;
  return parseInt(openTime.slice(0, 4), 10) || 2026;
}

async function fetchYearData(year) {
  try {
    const resp = await fetch(API_BASE + year, { cache: 'no-store' });
    const json = await resp.json();
    const raw = json.data || [];
    const out = [];
    for (const item of raw) {
      const parts = (item.openCode || '').split(',');
      if (parts.length !== 7) continue;
      const nums = parts.map(p => parseInt(p.trim(), 10));
      if (nums.some(n => isNaN(n))) continue;
      const periodNum = item.expect ? item.expect.slice(-3) : '001';
      const openYear = extractYear(item.openTime);
      const correctedPeriod = openYear + periodNum;
      out.push({ period: correctedPeriod, numbers: nums.slice(0,6), special: nums[6], openTime: item.openTime });
    }
    return out;
  } catch (e) {
    return [];
  }
}

async function fetchData() {
  const currentYear = new Date().getFullYear();
  const data = await fetchYearData(currentYear);
  return data.sort((a,b) => a.openTime.localeCompare(b.openTime));
}


function markovPredict(data) {
  if (data.length < 10) return { codes: Array.from({length:23}, (_,i) => i+1), zodiac: '鼠' };
  const transition = new Map();
  for (let i = 1; i < data.length; i++) {
    const prev = [...data[i-1].numbers, data[i-1].special];
    const next = [...data[i].numbers, data[i].special];
    for (const p of prev) for (const n of next) {
      const k = p + ',' + n;
      transition.set(k, (transition.get(k) || 0) + 1);
    }
  }
  const last = [...data[data.length-1].numbers, data[data.length-1].special];
  const scores = {};
  for (let n = 1; n <= 49; n++) {
    let total = 0;
    for (const p of last) total += transition.get(p + ',' + n) || 0;
    scores[n] = total / last.length;
  }
  const top23 = Object.keys(scores).map(Number).sort((a,b) => scores[b] - scores[a]).slice(0,23).sort((a,b) => a - b);
  const zc = {};
  for (const n of top23) { const z = getNumberZodiac(n); zc[z] = (zc[z]||0) + 1; }
  const topZodiac = Object.keys(zc).reduce((a,b) => zc[a] >= zc[b] ? a : b, '鼠');
  return { codes: top23, zodiac: topZodiac };
}

function frequencyPredict(data) {
  const recent = data.slice(-50);
  const freq = {};
  for (const d of [...data[data.length-1].numbers, data[data.length-1].special]) freq[d] = (freq[d]||0) + 1;
  for (let i = 0; i < recent.length; i++) {
    const w = (i+1) / recent.length;
    for (const n of [...recent[i].numbers, recent[i].special]) freq[n] = (freq[n]||0) + w * 0.5;
  }
  const top23 = Object.keys(freq).map(Number).sort((a,b) => freq[b] - freq[a]).slice(0,23).sort((a,b) => a - b);
  const zc = {};
  for (const n of top23) { const z = getNumberZodiac(n); zc[z] = (zc[z]||0) + 1; }
  const topZodiac = Object.keys(zc).reduce((a,b) => zc[a] >= zc[b] ? a : b, '鼠');
  return { codes: top23, zodiac: topZodiac };
}

function gapPredict(data) {
  const lastSeen = {};
  for (let i = 0; i < data.length; i++) {
    for (const n of [...data[i].numbers, data[i].special]) lastSeen[n] = i;
  }
  const gaps = {};
  for (let n = 1; n <= 49; n++) gaps[n] = data.length - (lastSeen[n] !== undefined ? lastSeen[n] : 0);
  const top23 = Object.keys(gaps).map(Number).sort((a,b) => gaps[b] - gaps[a]).slice(0,23).sort((a,b) => a - b);
  const zc = {};
  for (const n of top23) { const z = getNumberZodiac(n); zc[z] = (zc[z]||0) + 1; }
  const topZodiac = Object.keys(zc).reduce((a,b) => zc[a] >= zc[b] ? a : b, '鼠');
  return { codes: top23, zodiac: topZodiac };
}

// 生肖预测：30期特码频率法（回测12.6%，优于随机8.3%）
function zodiacPredictSpecial(data) {
  const recent30 = data.slice(-30);
  const freq = {};
  for (const d of recent30) {
    const z = getNumberZodiac(d.special);
    freq[z] = (freq[z]||0) + 1;
  }
  return Object.keys(freq).reduce((a,b) => freq[a] >= freq[b] ? a : b, '鼠');
}

// 23码预测：尾数热号法（回测53.7%，优于随机46.9%）
function tailHotPredict(data) {
  const recent30 = data.slice(-30);
  const tailFreq = {};
  for (const d of recent30) {
    const nums = [...d.numbers, d.special];
    for (const n of nums) { tailFreq[n % 10] = (tailFreq[n % 10]||0) + 1; }
  }
  // 选出现最多的5个尾数
  const sortedTails = Object.keys(tailFreq).map(Number).sort((a,b) => tailFreq[b]-tailFreq[a]);
  const topTails = new Set(sortedTails.slice(0,5));
  // 这5个尾数对应的所有号码
  const candidates = [];
  for (let n=1; n<=49; n++) { if (topTails.has(n%10)) candidates.push(n); }
  // 按频率排序取前23
  const freq = {};
  for (const d of recent30) {
    const nums = [...d.numbers, d.special];
    for (const n of nums) { freq[n] = (freq[n]||0) + 1; }
  }
  candidates.sort((a,b) => (freq[b]||0) - (freq[a]||0));
  return candidates.slice(0,23).sort((a,b) => a-b);
}

function compositePredict(data) {
  const tailCodes = tailHotPredict(data);
  const m = markovPredict(data);
  const f = frequencyPredict(data);
  const g = gapPredict(data);
  const vote = {};
  for (const n of tailCodes) vote[n] = (vote[n]||0) + 4;
  for (const n of m.codes) vote[n] = (vote[n]||0) + 2;
  for (const n of f.codes) vote[n] = (vote[n]||0) + 1;
  for (const n of g.codes) vote[n] = (vote[n]||0) + 1;
  const top23 = Object.keys(vote).map(Number).sort((a,b) => vote[b] - vote[a]).slice(0,23).sort((a,b) => a - b);
  // 生肖预测：独立的特码频率法
  const topZodiac = zodiacPredictSpecial(data);
  return { codes: top23, zodiac: topZodiac };
}

function getNextPeriod(data) {
  const last = data[data.length-1];
  const num = parseInt(last.period.slice(-3), 10);
  // API年份字段有bug（写着2025），直接用系统当前年份
  const year = new Date().getFullYear();
  // 处理跨年：如果期号+1超过100，可能年份要+1，但澳门Mark Six每年约100期，暂不处理
  return year + '' + pad2(num + 1);
}

const EMBEDDED_RECORDS = [
  {"period":"2026253","actual_numbers":[5,35,15,28,13,49],"actual_special":16,"code_hit":1,"zodiac_hit":1}
];

async function loadRecords() {
  // 优先尝试本地record.json（exe场景：file://协议直接读文件）
  try {
    const resp = await fetch('./record.json', {cache:'no-store'});
    if (resp.ok) {
      const json = await resp.json();
      if (json.history && json.history.length > 0) return json.history;
    }
  } catch(e) {}
  // 回退到硬编码数据（网页场景）
  return EMBEDDED_RECORDS;
}

function renderComposite(pred, nextPeriod) {
  document.getElementById('composite-title').textContent = '📊 23码综合预测 (多数投票融合) — 第 ' + nextPeriod + ' 期';
  const container = document.getElementById('composite-codes');
  container.innerHTML = pred.codes.map(n => '<span class="num-ball">' + pad2(n) + '</span>').join('');
  document.getElementById('composite-zodiac').textContent = pred.zodiac;
  document.getElementById('zodiac-title').textContent = '🐲 生肖预测 (平特肖) — 第 ' + nextPeriod + ' 期';
  document.getElementById('zodiac-result').innerHTML = '<span style="color:var(--green); font-weight:600;">' + pred.zodiac + '</span>';
}

async function renderRecords() {
  const records = await loadRecords();
  const tbody = document.getElementById('record-body');
  const fmtZ = (n) => pad2(n) + getNumberZodiac(n);

  const rows = [];
  for (const r of records) {
    const nums = (r.actual_numbers || r.numbers || []).slice(0, 6);
    const special = r.actual_special !== undefined ? r.actual_special : (r.actual_numbers || r.numbers || [])[6];
    const has = nums.length === 6 && special !== undefined;
    const lotteryNum = has ? nums.map(n => fmtZ(n)).join('+') + '=' + fmtZ(special) : '?';
    const codeHit = has ? (r.code_hit !== undefined ? r.code_hit : r.codeHit) : null;
    const zodiacHit = has ? (r.zodiac_hit !== undefined ? r.zodiac_hit : r.zodiacHit) : null;
    const codeIcon = codeHit === 1 ? '\u221a' : codeHit === 0 ? '\u00d7' : '?';
    const zodiacIcon = zodiacHit === 1 ? '\u221a' : zodiacHit === 0 ? '\u00d7' : '?';
    const codeColor = codeIcon === '\u221a' ? 'var(--green)' : codeIcon === '\u00d7' ? 'var(--red)' : 'var(--text)';
    const zodiacColor = zodiacIcon === '\u221a' ? 'var(--green)' : zodiacIcon === '\u00d7' ? 'var(--red)' : 'var(--text)';
    rows.push('<tr><td>' + r.period + '</td><td>' + lotteryNum + '</td><td style="color:' + codeColor + '">' + codeIcon + '</td><td style="color:' + zodiacColor + '">' + zodiacIcon + '</td></tr>');
  }

  tbody.innerHTML = rows.join('');
  const total = records.filter(r => (r.actual_numbers || r.numbers || []).length > 0).length;
  const codeWin = records.filter(r => (r.code_hit !== undefined ? r.code_hit : r.codeHit) === 1).length;
  const zodiacWin = records.filter(r => (r.zodiac_hit !== undefined ? r.zodiac_hit : r.zodiacHit) === 1).length;
  document.getElementById('record-summary').textContent = '累计' + total + '期：23码 ' + codeWin + '/' + total + '（' + (total > 0 ? (codeWin/total*100).toFixed(1) : '0') + '%），平特肖 ' + zodiacWin + '/' + total + '（' + (total > 0 ? (zodiacWin/total*100).toFixed(1) : '0') + '%）';
}

function copyCodes() {
  if (!compositeResult) return;
  const text = compositeResult.codes.map(n => pad2(n)).join(' ');
  navigator.clipboard.writeText(text).then(() => alert('已复制: ' + text));
}

function copyZodiac() {
  if (!compositeResult) return;
  navigator.clipboard.writeText(compositeResult.zodiac).then(() => alert('已复制: ' + compositeResult.zodiac));
}

async function init() {
  // 先渲染战绩（来自本地 EMBEDDED_RECORDS，不依赖网络）
  await renderRecords();

  try {
    allData = await fetchData();
    const lastPeriod = allData[allData.length-1].period;
    const nextPeriod = getNextPeriod(allData);
    compositeResult = compositePredict(allData);
    renderComposite(compositeResult, nextPeriod);
    document.getElementById('last-update').textContent = '数据截至 ' + lastPeriod + ' 期 · ' + new Date().toLocaleString('zh-CN');
  } catch (e) {
    document.getElementById('progress-text').textContent = '加载失败: ' + e.message;
    console.error(e);
  }
}

function forceUpdate() {
  const btn = document.getElementById('update-btn');
  btn.textContent = '⏳ 更新中...';
  btn.disabled = true;
  if ('serviceWorker' in navigator && 'caches' in window) {
    caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k))));
  }
  allData = [];
  compositeResult = null;
  fetchData().then(data => {
    allData = data;
    const lastPeriod = data[data.length-1].period;
    const nextPeriod = getNextPeriod(data);
    compositeResult = compositePredict(data);
    renderComposite(compositeResult, nextPeriod);
    document.getElementById('last-update').textContent = '数据截至 ' + lastPeriod + ' 期 · ' + new Date().toLocaleString('zh-CN');
    btn.textContent = '🔄 立即更新';
    btn.disabled = false;
  }).catch(e => {
    btn.textContent = '❌ 更新失败';
    setTimeout(() => { btn.textContent = '🔄 立即更新'; btn.disabled = false; }, 2000);
  });
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

(function() {
  var bar = document.getElementById('progress-bar');
  var text = document.getElementById('progress-text');
  var progress = 0;
  var timer = setInterval(function() {
    progress += Math.random() * 15 + 5;
    if (progress >= 95) progress = 95;
    bar.style.width = progress + '%';
    text.textContent = '加载中... ' + Math.floor(progress) + '%';
  }, 200);
  window.addEventListener('load', function() {
    clearInterval(timer);
    progress = 100;
    bar.style.width = '100%';
    text.textContent = '加载完成! 100%';
    setTimeout(function() {
      document.getElementById('loading').style.opacity = '0';
      setTimeout(function() {
        document.getElementById('loading').style.display = 'none';
        document.querySelector('.container').style.display = 'block';
      }, 500);
    }, 300);
  });
})();

init();
</script>
