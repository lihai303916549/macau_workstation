<script>
const API_BASE = 'https://history.macaumarksix.com/history/macaujc2/y/';
// 统一用 UTC+8（澳门/北京时间），避免用户设备时区导致年份、倒计时偏差
const UTC8_OFFSET_MS = 8 * 3600 * 1000;
// 取澳门时间的年份
function macauYear() { return new Date(Date.now() + UTC8_OFFSET_MS).getUTCFullYear(); }
let allData = [];
let compositeResult = null;

// 2026年标准生肖对照表（用户确认，查表法，禁止用公式推算）
const STD_2026 = {1:'马',2:'蛇',3:'龙',4:'兔',5:'虎',6:'牛',7:'鼠',8:'猪',9:'狗',10:'鸡',11:'猴',12:'羊'};
function getNumberZodiac(num) { const key = num <= 12 ? num : ((num - 1) % 12) + 1; return STD_2026[key]; }
function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function extractYear(openTime) {
  if (!openTime) return 2026;
  return parseInt(openTime.slice(0, 4), 10) || 2026;
}

async function fetchYearData(year) {
  try {
    const resp = await fetch(API_BASE + year, { cache: 'no-store' });
    const json = await resp.json();
    const raw = json.data || [];
    const out = [];
    for (const item of raw) {
      const parts = (item.openCode || '').split(',');
      if (parts.length !== 7) continue;
      const nums = parts.map(p => parseInt(p.trim(), 10));
      if (nums.some(n => isNaN(n))) continue;
      const periodNum = item.expect ? item.expect.slice(-3) : '001';
      const openYear = extractYear(item.openTime);
      const correctedPeriod = openYear + periodNum;
      out.push({ period: correctedPeriod, numbers: nums.slice(0,6), special: nums[6], openTime: item.openTime });
    }
    return out;
  } catch (e) {
    return [];
  }
}

// 内嵌历史数据解析（已按开奖时间升序排好）
// 每条格式：[期号, 开奖日期(YYYY-MM-DD), "6个正码,特码"]
function embeddedData() {
  var out = [];
  for (var i = 0; i < EMBEDDED_DATA.length; i++) {
    var row = EMBEDDED_DATA[i];
    var p = row[2].split(',');
    out.push({
      period: row[0],
      numbers: [+p[0], +p[1], +p[2], +p[3], +p[4], +p[5]],
      special: +p[6],
      openTime: row[1]
    });
  }
  return out;
}

// 网络数据被视为有效的最少期数（少于此值说明拉取不完整，继续用内置数据）
const MIN_NET_RECORDS = 50;

// 优先用实时数据；API 无 CORS 头导致浏览器取不到时，自动回退到内置数据
async function fetchData() {
  const base = embeddedData();
  try {
    const currentYear = macauYear();
    const net = await fetchYearData(currentYear);
    if (net && net.length >= MIN_NET_RECORDS) {
      net.sort((a, b) => a.openTime.localeCompare(b.openTime));
      if (net[net.length - 1].period > base[base.length - 1].period) {
        return { data: net, source: '实时' };
      }
    }
  } catch (e) {}
  return { data: base, source: '内置' };
}

// ===== 平肖（生肖预测）：七码(6正码+特码)频率众数法 =====
// 命中口径：开奖 7 个号（6 正码 + 特码）任一号码生肖 == 推荐生肖
// 这是网页一直显示的「平特肖」版本（用户习惯口径）：近30期 7 球生肖频率取最热
// 全量 walk-forward(621期)：约 51.85%，优于随机基线 ~47.7%
const ZODIACS = ['马','蛇','龙','兔','虎','牛','鼠','猪','狗','鸡','猴','羊'];
function zAll7Freq(H) {
  const r = H.slice(-30);
  const f = {}; ZODIACS.forEach(z => f[z] = 0);
  for (const d of r) {
    const nums = [...d.numbers, d.special];
    for (const n of nums) f[getNumberZodiac(n)]++;
  }
  return f;
}
// 基于七码频率，输出主推 + Top3 + 相对权重
function zEnsemble(H) {
  const f = zAll7Freq(H);
  const rk = ZODIACS.slice().sort((a, b) => f[b] - f[a]);
  const top1 = rk[0];
  const top3 = rk.slice(0, 3);
  const top3sum = top3.reduce((s, z) => s + f[z], 0);
  const probs = {};
  top3.forEach(z => probs[z] = top3sum > 0 ? f[z] / top3sum : 0);
  return { top1, ranked: rk, probs };
}
// 主推单生肖（与历史战绩口径兼容 predZodiacFor）
function zodiacPredictSpecial(data) { return zEnsemble(data).top1; }

// ===== 23码预测：尾数热号法 =====
// 取近30期最热 5 个尾数 → 对应全部号码 → 按出现频率取前 23 个
// 命中口径：开奖特码(特码)落在 23 码内（标准 23 码定义）
// 全量 walk-forward(621期)：约 44.93%（随机基线 23/49≈46.94%），长样本无显著优势
function tailHotPredict(data) {
  const recent30 = data.slice(-30);
  const tailFreq = {};
  for (const d of recent30) {
    const nums = [...d.numbers, d.special];
    for (const n of nums) { tailFreq[n % 10] = (tailFreq[n % 10] || 0) + 1; }
  }
  const sortedTails = Object.keys(tailFreq).map(Number).sort((a, b) => tailFreq[b] - tailFreq[a]);
  const topTails = new Set(sortedTails.slice(0, 5));
  const candidates = [];
  for (let n = 1; n <= 49; n++) { if (topTails.has(n % 10)) candidates.push(n); }
  const freq = {};
  for (const d of recent30) {
    const nums = [...d.numbers, d.special];
    for (const n of nums) { freq[n] = (freq[n] || 0) + 1; }
  }
  candidates.sort((a, b) => (freq[b] || 0) - (freq[a] || 0));
  return candidates.slice(0, 23).sort((a, b) => a - b);
}

function compositePredict(data) {
  const e = zEnsemble(data);
  return { codes: tailHotPredict(data), zodiac: e.top1, top3: e.ranked.slice(0,3), probs: e.probs, six: sixZodiacPredict(data) };
}

// ===== 6肖推荐（专盯特码球 / 特码，最后一球）=====
// 命中口径：开奖特码(最后一球)的生肖 ∈ 推荐 6 肖 即中（标准「六肖」玩法）
// 算法：近20期特码球生肖「频率(×1) + 轻微遗漏(×0.05)」加权取最热 6 个
// 全量 walk-forward(651期)：约 48.02%（理论随机基线 6/12≈50%；特码近随机，长期趋向 50%）
function sixZodiacPredict(data, win=20, k=6) {
  const r = data.slice(-win);
  const f = {}; ZODIACS.forEach(z => f[z] = 0);
  for (const d of r) f[getNumberZodiac(d.special)]++;
  const last = {}; ZODIACS.forEach(z => last[z] = -1e9);
  r.forEach((d, idx) => { last[getNumberZodiac(d.special)] = idx; });
  const miss = {}; ZODIACS.forEach(z => miss[z] = (r.length - 1) - last[z]);
  const score = {}; ZODIACS.forEach(z => score[z] = f[z] * 1.0 + miss[z] * 0.05);
  return ZODIACS.slice().sort((a, b) => score[b] - score[a]).slice(0, k);
}

function getNextPeriod(data) {
  const last = data && data.length ? data[data.length - 1] : null;
  if (last) {
    // 优先：按期末开奖日期(YYYY-MM-DD) +1 天推算（已验证可处理跨年）
    const dayStr = (last.openTime || '').slice(0, 10);
    const t = Date.parse(dayStr + 'T00:00:00Z');
    if (!isNaN(t)) {
      const p = periodOfDate(new Date(t + 86400000));
      if (p && p.length === 7 && !isNaN(+p.slice(3))) return p;   // 合法期号才用
    }
    // openTime 缺失/异常：改从末期期号本身推算次日（day-of-year+1，自动跨年）
    try {
      const ps = String(last.period);
      const y = +ps.slice(0, 4);
      const doy = +ps.slice(4);
      if (y >= 2000 && doy >= 1 && doy <= 366) {
        const d = new Date(Date.UTC(y, 0, 1) + (doy - 1) * 86400000);   // 末期开奖日(UTC)：期号DDD=年内第DDD天=Jan1+(DDD-1)天
        const p = periodOfDate(new Date(d.getTime() + 86400000));
        if (p && p.length === 7 && !isNaN(+p.slice(3))) return p;
      }
    } catch (e) {}
  }
  // 兜底：按当前澳门开奖日推算（不依赖内嵌数据），保证任何情况下都不出现 NaN
  return offlineNextPeriod();
}

const EMBEDDED_RECORDS = [
  {"period":"2026288","actual_numbers":[15,17,41,36,13,24],"actual_special":42,"code_hit":1,"zodiac_hit":1,"six_hit":0}
];

// 战绩有两份数据源（record.json 与 EMBEDDED_RECORDS），校验是否同步，避免只改一处
function checkRecordSync(fromJson) {
  const a = fromJson.map(r => r.period).join(',');
  const b = EMBEDDED_RECORDS.map(r => r.period).join(',');
  if (a !== b) {
    console.warn('[战绩不同步] record.json 与 EMBEDDED_RECORDS 期号不一致\n' +
      '  record.json: ' + (a || '(空)') + '\n  页面内嵌: ' + (b || '(空)') +
      '\n  更新战绩时两处都要改。');
  }
}

async function loadRecords() {
  // 优先尝试本地record.json（exe场景：file://协议直接读文件）
  try {
    const resp = await fetch('./record.json', {cache:'no-store'});
    if (resp.ok) {
      const json = await resp.json();
      if (json.history && json.history.length > 0) {
        checkRecordSync(json.history);
        return json.history;
      }
    }
  } catch(e) {}
  // 回退到硬编码数据（网页场景）
  return EMBEDDED_RECORDS;
}

function copyText(text) {
  if (!text) return;
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}
function showToast(msg) {

    document.body.appendChild(t);

  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._timer); t._timer = setTimeout(() => { t.style.display = 'none'; }, 1800);
}

function predZodiacFor(period) {
  // 用截至该期之前的完整开奖历史，重算「当时」推荐生肖（7球频率众数，与线上 zodiacPredictSpecial/zEnsemble 一致）
  const before = EMBEDDED_DATA
    .filter(row => row[0] < period)
    .map(row => {
      const nums = String(row[2]).split(',').map(Number);
      return { numbers: nums.slice(0, 6), special: nums[6] };
    });
  if (before.length < 30) return null;
  return zodiacPredictSpecial(before);
}

function predCodesFor(period) {
  // 用截至该期之前的完整开奖历史，重算「当时」23码（尾数热号法，与线上 tailHotPredict 一致）
  const before = EMBEDDED_DATA
    .filter(row => row[0] < period)
    .map(row => {
      const nums = String(row[2]).split(',').map(Number);
      return { numbers: nums.slice(0, 6), special: nums[6] };
    });
  if (before.length < 30) return null;
  return tailHotPredict(before);
}

function predSixFor(period) {
  // 用截至该期之前的完整开奖历史，重算「当时」6肖（频率+遗漏加权，与线上 sixZodiacPredict 一致）
  const before = EMBEDDED_DATA
    .filter(row => row[0] < period)
    .map(row => {
      const nums = String(row[2]).split(',').map(Number);
      return { numbers: nums.slice(0, 6), special: nums[6] };
    });
  if (before.length < 20) return null;
  return sixZodiacPredict(before);
}

async function renderRecords() {
  const records = await loadRecords();
  const fmtZ = (n) => pad2(n) + getNumberZodiac(n);

  const rows = [];
  let codeWin = 0, zodiacWin = 0, sixWin = 0, counted = 0;
  for (const r of records) {
    const nums = (r.actual_numbers || r.numbers || []).slice(0, 6);
    const special = r.actual_special !== undefined ? r.actual_special : (r.actual_numbers || r.numbers || [])[6];
    const has = nums.length === 6 && special !== undefined;
    const lotteryNum = has ? nums.map(n => fmtZ(n)).join('+') + '=' + fmtZ(special) : '?';
    // 23码命中：特码(特码)落在 23 码内
    const predC = predCodesFor(r.period);
    const codeHit = (has && predC) ? (predC.includes(special) ? 1 : 0) : null;
    // 平特肖命中：开奖 7 个号（6正码+特码）任一生肖 == 推荐生肖（网页一直显示的口径）
    const predZ = predZodiacFor(r.period);
    const zodiacHit = (has && predZ) ? ([...nums, special].some(n => getNumberZodiac(n) === predZ) ? 1 : 0) : null;
    // 6肖命中：特码(最后一球)生肖 ∈ 推荐6肖
    const predS = predSixFor(r.period);
    const sixHit = (has && predS) ? (predS.includes(getNumberZodiac(special)) ? 1 : 0) : null;
    const codeIcon = codeHit === 1 ? '✓' : codeHit === 0 ? '✗' : '?';
    const zodiacIcon = zodiacHit === 1 ? '✓' : zodiacHit === 0 ? '✗' : '?';
    const sixIcon = sixHit === 1 ? '✓' : sixHit === 0 ? '✗' : '?';
    const codeColor = codeIcon === '✓' ? 'var(--green)' : codeIcon === '✗' ? 'var(--red)' : 'var(--text)';
    const zodiacColor = zodiacIcon === '✓' ? 'var(--green)' : zodiacIcon === '✗' ? 'var(--red)' : 'var(--text)';
    const sixColor = sixIcon === '✓' ? 'var(--green)' : sixIcon === '✗' ? 'var(--red)' : 'var(--text)';
    rows.push('<tr><td>' + r.period + '</td><td>' + lotteryNum + '</td>' +
      '<td style="color:' + codeColor + '">' + codeIcon + '</td>' +
      '<td style="color:' + zodiacColor + '">' + (predZ ? predZ + ' ' : '') + zodiacIcon + '</td>' +
      '<td style="color:' + sixColor + '">' + (predS ? predS.join('/') + ' ' : '') + sixIcon + '</td></tr>');
    if (has) counted++;
    if (has && codeHit === 1) codeWin++;
    if (has && zodiacHit === 1) zodiacWin++;
    if (has && sixHit === 1) sixWin++;
  }

  setHtml('record-body', rows.join(''));
  setText('record-summary', '累计' + counted + '期：23码 ' + codeWin + '/' + counted + '（' + (counted > 0 ? (codeWin/counted*100).toFixed(1) : '0') + '%），平特肖 ' + zodiacWin + '/' + counted + '（' + (counted > 0 ? (zodiacWin/counted*100).toFixed(1) : '0') + '%），6肖 ' + sixWin + '/' + counted + '（' + (counted > 0 ? (sixWin/counted*100).toFixed(1) : '0') + '%）');
}

async function init() {
  // 先渲染战绩（来自本地 EMBEDDED_RECORDS，不依赖网络）
  await renderRecords();

  try {

    allData = fetched.data;
    const lastPeriod = allData[allData.length-1].period;
    const nextPeriod = getNextPeriod(allData);
    compositeResult = compositePredict(allData);
    renderComposite(compositeResult, nextPeriod);
    renderSixZodiac(compositeResult, nextPeriod);
    currentNextPeriod = nextPeriod;
    setText('last-update', '数据截至 ' + lastPeriod + ' 期 · ' + new Date().toLocaleString('zh-CN') + ' · 数据源：' + fetched.source);
  } catch (e) {
    setText('progress-text', '加载失败: ' + e.message);
    console.error(e);
  }
}

// 「强制刷新」：清掉本地缓存并重新加载页面，用于拉取云端已部署的最新版本。
// 注意：这里不再去请求开奖接口 —— 接口无 CORS 头，浏览器取不到，数据一律来自内置。
function forceUpdate() {
  const btn = document.getElementById('update-btn');
  if (!btn) return;
  btn.textContent = '⏳ 刷新中...';
  btn.disabled = true;

  // 清 Service Worker 缓存
  var clearCaches = (window.caches && caches.keys)
    ? caches.keys().then(function (keys) {
        return Promise.all(keys.map(function (k) { return caches.delete(k); }));
      }).catch(function () {})
    : Promise.resolve();

  // 注销旧 Service Worker，重新加载时会拉新版
  var unregister = (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
    ? navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) { return r.unregister(); }));
      }).catch(function () {})
    : Promise.resolve();

  Promise.all([clearCaches, unregister]).then(function () {
    if (location.protocol === 'file:') {
      location.reload();                 // 本地打开时直接重载
      return;
    }
    // 加时间戳，绕开浏览器磁盘缓存，确保拿到云端最新部署
    var url = location.href.split('#')[0];
    url += (url.indexOf('?') === -1 ? '?' : '&') + '_t=' + Date.now();
    location.replace(url);
  });
}

// ===== 开奖倒计时 =====
// 澳门 Mark Six 每天一期，开奖时刻固定 21:32:32（澳门/北京时间 UTC+8）
const DRAW_H = 21, DRAW_M = 32, DRAW_S = 32;
// 实测验证：期号 = 该日期在当年的第几天
//   2023-12-31 → 2023365（平年）  2024-12-31 → 2024366（闰年）
//   2025-12-31 → 2025365          2026-01-01 → 2026001
//   2023-01-04 未开奖，但期号仍按阳历编，故直接算「年内第几天」最准
function periodOfDate(date) {
  const y = date.getUTCFullYear();
  const doy = Math.floor((date.getTime() - Date.UTC(y, 0, 1)) / 86400000) + 1;
  return y + '' + String(doy).padStart(3, '0');
}

let currentNextPeriod = null;   // 由 init/forceUpdate 实时算出；未算出时用 offlineNextPeriod 兜底

// 统一按 UTC+8 计算，避免用户设备时区导致倒计时偏差
function nextDrawDate() {
  const macau = new Date(Date.now() + UTC8_OFFSET_MS);   // 其 UTC 字段即澳门本地时间
  let t = Date.UTC(macau.getUTCFullYear(), macau.getUTCMonth(), macau.getUTCDate(),
                   DRAW_H - 8, DRAW_M, DRAW_S);
  if (Date.now() >= t) t += 86400000;
  return new Date(t);
}

// 离线兜底：直接用下次开奖日期算期号，不依赖内嵌数据
function offlineNextPeriod() {
  try {
    return periodOfDate(nextDrawDate());
  } catch (e) { return '下期'; }
}


// 当前日期（澳门时间 UTC+8），如：2026年9月11日 星期五
const WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
function formatMacauDate() {
  const d = new Date(Date.now() + UTC8_OFFSET_MS);
  return d.getUTCFullYear() + '年' + (d.getUTCMonth() + 1) + '月' + d.getUTCDate() + '日 ' + WEEKDAYS[d.getUTCDay()];
}

function updateCountdown() {
  setText('now-date', formatMacauDate());
  const el = document.getElementById('countdown');
  if (!el) return;
  const diff = nextDrawDate().getTime() - Date.now();
  const period = currentNextPeriod || offlineNextPeriod();
  if (diff <= 0) {
    el.innerHTML = '🎯 第 <b>' + period + '</b> 期开奖中...';
    return;
  }
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  el.innerHTML = '⏰ 距 <b>' + period + '</b> 期开奖 <b style="color:var(--accent);">' +
    pad2(h) + ':' + pad2(m) + ':' + pad2(s) + '</b>';
}

let countdownTimer = setInterval(updateCountdown, 1000);
updateCountdown();

// 页面切到后台时暂停计时，回到前台立即刷新并恢复
document.addEventListener('visibilitychange', function () {
  clearInterval(countdownTimer);
  if (!document.hidden) {
    updateCountdown();
    countdownTimer = setInterval(updateCountdown, 1000);
  }
});

if ('serviceWorker' in navigator && navigator.serviceWorker) {
  const sw = navigator.serviceWorker;
  if (typeof sw.addEventListener === 'function') {
    let swReloading = false;
    sw.addEventListener('controllerchange', () => {
      if (swReloading) return;
      swReloading = true;
      location.reload();
    });
  }
  if (typeof sw.register === 'function') {
    sw.register('./sw.js').catch(() => {});
  }
}
